[package]
name = "Ar6CClient"
version = "0.1.0"
edition = "2024"

[profile.dev]
#debug = "line-tables-only"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

[package.metadata.android.signing.release]
# uncomment for working
# path = "" # use your own key for signing apk in release mode
# keystore_password = "" # use your own password for signing apk in release mode

[lib]
crate-type = ["cdylib"] # Crucial: Compiles the project as a dynamic C library (.so) For android

[package.metadata.android.application]
uses_cleartext_traffic = true # for http protocol(not https)

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "persistence", "glow"] } # make sure its compares with default eframe only with adding android-native-activity
egui-file-dialog = "0.15"
progenitor = { git = "https://github.com/oxidecomputer/progenitor" }
uuid = { version = "1.0.0", features = ["serde", "v4"] }
reqwest = { version = "0.13", features = ["json", "query", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
futures = "0.3.34"
bytes = "1.12.1"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
content_disposition = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6.1" # For android
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "persistence", "android-native-activity", "glow"] } # make sure its compares with default eframe only with adding android-native-activity
jni = "0.21"
ndk-context = "0.1"
